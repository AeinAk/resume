<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="رزومه آنلاین شخصی">
<title>رزومه شخصی</title>

<!-- setting the theme and lang soon to prevent bugs-->
<script>
(function () {
  try {
    var theme = localStorage.getItem('resume-theme');
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);

    var lang = localStorage.getItem('resume-lang') || 'fa';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
  } catch (e) {}
})();
</script>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%233452D9'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="ariaLabels.skip">رفتن به محتوای اصلی</a>

<div class="layout">

  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button type="button" class="icon-btn nav-toggle" id="navToggle" aria-expanded="false" aria-controls="sideNav" data-i18n-aria="ariaLabels.menuToggle">
        <svg class="icon-menu" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        <svg class="icon-close" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>

      <div class="controls">
        <button type="button" class="pill-btn" id="langToggle" data-i18n-aria="ariaLabels.langToggle">
          <span id="langToggleLabel">EN</span>
        </button>
        <button type="button" class="icon-btn" id="themeToggle" data-i18n-aria="ariaLabels.themeToggle">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="4"/><path d="M10 1.5v2M10 16.5v2M18.5 10h-2M3.5 10h-2M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4M15.6 15.6l-1.4-1.4M5.8 5.8L4.4 4.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11.5A7.5 7.5 0 1 1 8.5 3a6 6 0 0 0 8.5 8.5Z"/></svg>
        </button>
      </div>
    </div>

    <div class="profile">
      <div class="avatar" id="avatar">--</div>
      <h1 class="name" data-i18n="profile.name"></h1>
      <p class="role" data-i18n="profile.role"></p>
      <p class="tagline" data-i18n="profile.tagline"></p>

      <div class="profile-meta">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 18s6-5.1 6-9.8A6 6 0 0 0 4 8.2C4 12.9 10 18 10 18Z"/><circle cx="10" cy="8" r="2.1"/></svg>
        <span data-i18n="profile.location"></span>
      </div>

      <div class="profile-actions">
        <a href="assets/resume.pdf" download class="btn btn-primary" data-i18n="profile.cta.resume"></a>
        <a href="#contact" class="btn btn-ghost" data-i18n="profile.cta.contact"></a>
      </div>
    </div>

    <nav class="side-nav" id="sideNav">
      <ul>
        <li><a href="#about" data-i18n="nav.about"></a></li>
        <li><a href="#education" data-i18n="nav.education"></a></li>
        <li><a href="#skills" data-i18n="nav.skills"></a></li>
        <li><a href="#experience" data-i18n="nav.experience"></a></li>
        <li><a href="#certificates" data-i18n="nav.certificates"></a></li>
        <li><a href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
    </nav>

    <div class="sidebar-socials" id="socials"></div>
  </aside>

  <!-- main -->

  <main id="main" class="content">

    <section id="about" class="section">
      <h2 data-i18n="about.heading"></h2>
      <p class="section-lead" data-i18n="about.body"></p>
    </section>

    <section id="education" class="section">
      <h2 data-i18n="education.heading"></h2>
      <div class="timeline" id="educationList"></div>
    </section>

    <section id="skills" class="section">
      <h2 data-i18n="skills.heading"></h2>
      <div class="skills-groups" id="skillsList"></div>
    </section>

    <section id="experience" class="section">
      <h2 data-i18n="experience.heading"></h2>
      <div class="timeline" id="experienceList"></div>
    </section>

    <section id="certificates" class="section">
      <h2 data-i18n="certificates.heading"></h2>
      <div class="cert-list" id="certificatesList"></div>
    </section>

    <section id="contact" class="section">
      <h2 data-i18n="contact.heading"></h2>
      <p class="section-lead" data-i18n="contact.body"></p>
      <div class="contact-grid" id="contactGrid"></div>
    </section>

    <footer class="footer">
      <p data-i18n="footer.text"></p>
    </footer>

  </main>
</div>

<script src="js/content.js"></script>
<script src="js/script.js"></script>
</body>
</html>
